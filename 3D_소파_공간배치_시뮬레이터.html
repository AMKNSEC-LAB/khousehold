<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D 소파 공간배치 시뮬레이터</title>
  <style>
    :root {
      --bg: #eef1f5;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #667085;
      --line: #d8dee8;
      --accent: #315efb;
      --accent-soft: #edf1ff;
      --good: #168a55;
      --warn: #b7791f;
      --bad: #c24135;
      --shadow: 0 18px 45px rgba(28, 40, 66, 0.14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top left, #f8fafc 0, var(--bg) 46%, #e2e8f0 100%);
      color: var(--ink);
      font-family: Pretendard, Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 380px;
      width: 100vw;
      height: 100vh;
      gap: 18px;
      padding: 18px;
    }

    .viewer-card, .side-panel {
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 26px;
      background: rgba(255, 255, 255, 0.78);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      overflow: hidden;
    }

    .viewer-card {
      position: relative;
      min-width: 0;
    }

    #viewer {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }

    #viewer.dragging { cursor: grabbing; }

    .viewer-badge {
      position: absolute;
      left: 22px;
      top: 20px;
      max-width: min(520px, calc(100% - 44px));
      padding: 14px 16px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.84);
      border: 1px solid rgba(216, 222, 232, 0.9);
      box-shadow: 0 10px 24px rgba(20, 29, 48, 0.1);
      pointer-events: none;
    }

    .viewer-badge h1 {
      margin: 0 0 6px;
      font-size: 18px;
      line-height: 1.25;
      letter-spacing: -0.03em;
    }

    .viewer-badge p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .viewer-logo {
      position: absolute;
      left: 22px;
      bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: min(360px, calc(100% - 44px));
      padding: 9px 12px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.76);
      border: 1px solid rgba(216, 222, 232, 0.85);
      box-shadow: 0 10px 24px rgba(20, 29, 48, 0.1);
      pointer-events: none;
    }

    .brand-logo {
      flex: 0 0 auto;
      width: 132px;
      height: auto;
      display: block;
      border-radius: 8px;
      background: #111;
      object-fit: contain;
    }

    .viewer-logo > span {
      font-size: 12px;
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .viewer-message {
      position: absolute;
      right: 22px;
      bottom: 20px;
      max-width: min(420px, calc(100% - 44px));
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(255, 244, 230, 0.94);
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: #7c3f00;
      box-shadow: 0 10px 24px rgba(20, 29, 48, 0.1);
      font-size: 12px;
      line-height: 1.45;
      display: none;
      z-index: 3;
    }

    .viewer-message.show { display: block; }

    .side-panel {
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding: 20px;
      overflow: auto;
    }

    .panel-header { margin-bottom: 18px; }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: linear-gradient(135deg, #f8fbff, #eef6ff);
    }

    .brand-row strong {
      display: block;
      font-size: 14px;
      letter-spacing: -0.03em;
    }

    .brand-row span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.25;
    }

    .panel-header h2 {
      margin: 0 0 6px;
      font-size: 22px;
      letter-spacing: -0.04em;
    }

    .panel-header p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .section {
      padding: 16px 0;
      border-top: 1px solid var(--line);
    }

    .section:first-of-type { border-top: 0; padding-top: 0; }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 10px;
    }

    .section-title h3 {
      margin: 0;
      font-size: 15px;
      letter-spacing: -0.02em;
    }

    .field-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 13px;
      padding: 0 12px;
      color: var(--ink);
      background: #f9fafb;
      font: inherit;
      outline: none;
    }

    input:focus {
      border-color: rgba(49, 94, 251, 0.65);
      box-shadow: 0 0 0 4px rgba(49, 94, 251, 0.1);
      background: #fff;
    }

    button {
      min-height: 42px;
      border: 0;
      border-radius: 14px;
      padding: 0 13px;
      background: var(--ink);
      color: #fff;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
      white-space: nowrap;
    }

    button:hover { transform: translateY(-1px); box-shadow: 0 8px 18px rgba(23, 32, 51, 0.16); }
    button:active { transform: translateY(0); box-shadow: none; }

    .primary { width: 100%; margin-top: 10px; background: var(--accent); }
    .ghost { background: #f3f5f8; color: var(--ink); border: 1px solid var(--line); }
    .danger { background: #fff1f0; color: var(--bad); border: 1px solid #ffd7d2; }

    .preset-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .preset-card {
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      min-height: 74px;
      padding: 11px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fff;
      cursor: pointer;
      transition: border-color 0.18s ease, transform 0.18s ease, background 0.18s ease;
    }

    .preset-card:hover { transform: translateY(-1px); border-color: rgba(49, 94, 251, 0.4); }
    .preset-card.active { border-color: var(--accent); background: var(--accent-soft); }

    .swatch {
      width: 36px;
      height: 36px;
      border-radius: 13px;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.08);
    }

    .preset-name {
      margin: 0 0 4px;
      font-size: 13px;
      font-weight: 900;
      line-height: 1.25;
      word-break: keep-all;
    }

    .preset-meta {
      margin: 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.25;
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .button-row + .button-row { margin-top: 10px; }

    .metrics {
      display: grid;
      gap: 10px;
    }

    .metric {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 42px;
      padding: 10px 12px;
      border-radius: 15px;
      background: #f8fafc;
      border: 1px solid var(--line);
    }

    .metric span:first-child {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .metric strong {
      text-align: right;
      font-size: 13px;
      word-break: keep-all;
    }

    .status-good { color: var(--good); }
    .status-warn { color: var(--warn); }
    .status-bad { color: var(--bad); }

    .help {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    @media (max-width: 980px) {
      body { overflow: auto; }
      .app {
        grid-template-columns: 1fr;
        height: auto;
        min-height: 100vh;
      }
      .viewer-card { height: 62vh; min-height: 420px; }
      .side-panel { max-height: none; }
    }

    @media (max-width: 560px) {
      .app { padding: 10px; gap: 10px; }
      .viewer-card, .side-panel { border-radius: 20px; }
      .viewer-badge { left: 12px; top: 12px; padding: 11px 12px; }
      .viewer-logo { left: 12px; bottom: 12px; padding: 8px 10px; }
      .viewer-message { right: 12px; bottom: 68px; }
      .viewer-badge h1 { font-size: 15px; }
      .viewer-badge p { font-size: 12px; }
      .viewer-logo span { font-size: 11px; }
      .brand-logo { width: 116px; }
      .side-panel { padding: 14px; }
      .preset-grid, .field-grid, .button-row { grid-template-columns: 1fr; }
      .viewer-card { height: 56vh; min-height: 340px; }
    }
  </style>
</head>

    <aside class="side-panel">

  <script type="module">

    const presets = [
      { name: '케이하우스홀드 오르드 4인 라이트', short: 'ORD4 LIGHT', color: 0xd8c8b8, accent: 0x9a8a78, w: 2.6, d: 1.05, seats: 4, type: 'glb', modelUrl: 'ORD4-LIGHT.glb' },
      { name: '케이하우스홀드 켄지 4인', short: 'KENZY4', color: 0xd8c8b8, accent: 0x9a8a78, w: 2.6, d: 1.05, seats: 4, type: 'glb', modelUrl: 'KENZY4.glb' },
      { name: '케이하우스홀드 카든 3인', short: 'CARDEN3', color: 0x17191d, accent: 0x3b3f46, w: 2.3, d: 1.02, seats: 3, type: 'glb', modelUrl: 'CARDEN3.glb' },
      { name: '케이하우스홀드 무에나 3인용 구스 패브릭 소파', short: '무에나 3인 아이보리', color: 0xeee4d5, accent: 0xcfc0ac, w: 2.06, d: 1.03, seats: 3, type: 'muena' },
      { name: 'Modular Sofa FREE', short: '모듈러 4인', color: 0x565b63, accent: 0xb8bec8, w: 2.8, d: 1.55, seats: 3, type: 'modular' },
      { name: 'Furniture FREE Pack', short: '클래식 3인', color: 0xb7956b, accent: 0xf1d4a9, w: 2.35, d: 0.98, seats: 3, type: 'classic' },
      { name: 'Low Poly Simple Furniture', short: '모던 체어', color: 0x2a9d8f, accent: 0xd9f5ee, w: 1.02, d: 0.9, seats: 1, type: 'modern' },
      { name: 'Cute Furniture FREE', short: '러브시트', color: 0x779bd3, accent: 0xf8d7e6, w: 1.72, d: 0.92, seats: 2, type: 'cute' },
      { name: 'Furniture Mega Pack - Free', short: '라운지형', color: 0xf0e4cf, accent: 0x9b6d45, w: 2.55, d: 1.42, seats: 2, type: 'lounge' },
      { name: 'Meshtint Free Super Furniture', short: '코너형', color: 0x303846, accent: 0xd0d5dd, w: 2.45, d: 2.05, seats: 4, type: 'corner' }
    ];

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xdfe6ee);
    scene.fog = new THREE.Fog(0xdfe6ee, 8, 18);

    const camera = new THREE.PerspectiveCamera(47, 1, 0.1, 100);
    camera.position.set(4.6, 3.2, 5.3);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    viewer.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(0, 0.8, 0);
    controls.maxPolarAngle = Math.PI * 0.48;
    controls.minDistance = 3.2;
    controls.maxDistance = 10;

    const roomGroup = new THREE.Group();
    const sofaGroup = new THREE.Group();
    scene.add(roomGroup, sofaGroup);

    let roomWidth = 5.2;
    let roomDepth = 4.2;
    let selectedPresetIndex = 3;
    let selectedSofa = null;
    let sofaId = 0;
    let isDragging = false;
    let dragOffset = new THREE.Vector3();
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    const floorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
    const dragPoint = new THREE.Vector3();
    const gltfLoader = new GLTFLoader();
    const modelCache = new Map();

    const common = {
      wall: new THREE.MeshStandardMaterial({ color: 0xf4efe7, roughness: 0.82 }),
      trim: new THREE.MeshStandardMaterial({ color: 0xd9cec1, roughness: 0.75 }),
      glass: new THREE.MeshPhysicalMaterial({ color: 0xb9d7ea, roughness: 0.12, transmission: 0.25, transparent: true, opacity: 0.58 }),
      black: new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.55 }),
      wood: new THREE.MeshStandardMaterial({ color: 0x8a5b35, roughness: 0.72 }),
      metal: new THREE.MeshStandardMaterial({ color: 0x20242b, roughness: 0.35, metalness: 0.55 })
    };

    function makeMat(color, roughness = 0.82, metalness = 0) {
      return new THREE.MeshStandardMaterial({ color, roughness, metalness });
    }

    function makeFabricMat(baseColor, lineColor = '#d7cbb8') {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = `#${baseColor.toString(16).padStart(6, '0')}`;
      ctx.fillRect(0, 0, 256, 256);
      ctx.globalAlpha = 0.22;
      ctx.strokeStyle = lineColor;
      for (let i = 0; i < 256; i += 6) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i + Math.sin(i) * 1.4, 256);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(256, i + Math.cos(i) * 1.2);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(2.4, 2.4);
      texture.colorSpace = THREE.SRGBColorSpace;
      return new THREE.MeshStandardMaterial({ color: 0xffffff, map: texture, roughness: 0.94 });
    }

    function addBox(parent, size, pos, mat, cast = true, receive = true, rot = null) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(size[0], size[1], size[2]), mat);
      mesh.position.set(pos[0], pos[1], pos[2]);
      if (rot) mesh.rotation.set(rot[0], rot[1], rot[2]);
      mesh.castShadow = cast;
      mesh.receiveShadow = receive;
      parent.add(mesh);
      return mesh;
    }

    function addRoundedBox(parent, size, pos, mat, radius = 0.045, segments = 4, rot = null) {
      const geometry = new RoundedBoxGeometry(size[0], size[1], size[2], segments, radius);
      const mesh = new THREE.Mesh(geometry, mat);
      mesh.position.set(pos[0], pos[1], pos[2]);
      if (rot) mesh.rotation.set(rot[0], rot[1], rot[2]);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function addCylinder(parent, radiusTop, radiusBottom, height, pos, mat, segments = 24, rot = null) {
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radiusTop, radiusBottom, height, segments), mat);
      mesh.position.set(pos[0], pos[1], pos[2]);
      if (rot) mesh.rotation.set(rot[0], rot[1], rot[2]);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function disposeObject(object) {
      object.traverse((child) => {
        if (!child.isMesh) return;
        child.geometry?.dispose();
        const disposeMaterial = (mat) => {
          Object.values(mat).forEach((value) => {
            if (value && value.isTexture) value.dispose();
          });
          mat.dispose();
        };
        if (Array.isArray(child.material)) child.material.forEach(disposeMaterial);
        else if (child.material) disposeMaterial(child.material);
      });
    }

    function clearGroup(group) {
      [...group.children].forEach((child) => {
        group.remove(child);
        disposeObject(child);
      });
    }

    function createWoodTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#a46d3f';
      ctx.fillRect(0, 0, 512, 512);
      for (let y = 0; y < 512; y += 38) {
        ctx.fillStyle = y % 76 === 0 ? '#b77a46' : '#8f5b34';
        ctx.fillRect(0, y, 512, 2);
        ctx.fillStyle = 'rgba(255,255,255,0.08)';
        ctx.fillRect(0, y + 8, 512, 1);
      }
      for (let i = 0; i < 90; i++) {
        ctx.strokeStyle = `rgba(70, 36, 16, ${0.05 + Math.random() * 0.08})`;
        ctx.beginPath();
        const y = Math.random() * 512;
        ctx.moveTo(0, y);
        for (let x = 0; x < 512; x += 32) ctx.lineTo(x, y + Math.sin(x * 0.025 + i) * 5);
        ctx.stroke();
      }
      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(2.5, 2.5);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    function buildRoom() {
      clearGroup(roomGroup);
      const floorMat = new THREE.MeshStandardMaterial({ map: createWoodTexture(), roughness: 0.68 });
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(roomWidth, roomDepth), floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      roomGroup.add(floor);

      const wallH = 2.8;
      addBox(roomGroup, [roomWidth, wallH, 0.08], [0, wallH / 2, -roomDepth / 2], common.wall, false, true);
      addBox(roomGroup, [0.08, wallH, roomDepth], [-roomWidth / 2, wallH / 2, 0], common.wall, false, true);
      addBox(roomGroup, [0.08, wallH, roomDepth], [roomWidth / 2, wallH / 2, 0], common.wall, false, true);

      points.forEach(([x, z]) => addCylinder(parent, 0.035, 0.045, 0.2, [x, 0.1, z], mat, 12));
    }

    function cloneModelScene(source) {
      const clone = source.clone(true);
      const importedLights = [];
      clone.traverse((child) => {
        if (child.isLight) {
          importedLights.push(child);
          return;
        }
        if (!child.isMesh) return;
        child.geometry = child.geometry.clone();
        child.material = Array.isArray(child.material) ? child.material.map((mat) => mat.clone()) : child.material.clone();
        child.castShadow = true;
        child.receiveShadow = true;
      });
      importedLights.forEach((light) => light.parent?.remove(light));
      return clone;
    }

    function normalizeImportedMaterials(model, preset) {
      model.traverse((child) => {
        if (!child.isMesh) return;
        const materials = Array.isArray(child.material) ? child.material : [child.material];
        materials.forEach((mat) => {
          if (!mat) return;
          if (mat.emissive) mat.emissive.set(0x000000);
          mat.emissiveIntensity = 0;
          if (preset.modelUrl === 'ORD4-LIGHT.glb') {
            mat.roughness = THREE.MathUtils.clamp(mat.roughness ?? 0.42, 0.34, 0.56);
            mat.metalness = Math.min(mat.metalness ?? 0.03, 0.05);
            if (mat.color) mat.color.multiplyScalar(1.12);
          } else {
            mat.roughness = Math.max(mat.roughness ?? 0.65, 0.72);
            mat.metalness = Math.min(mat.metalness ?? 0, 0.08);
          }
          mat.needsUpdate = true;
        });
      });
    }

    function getUnitScale(size) {
      const maxDim = Math.max(size.x, size.y, size.z);
      if (maxDim > 500) return 0.001;
      if (maxDim > 20) return 0.01;
      return 1;
    }

    function fitModelToSofaGroup(group, model, preset) {
      let box = new THREE.Box3().setFromObject(model);
      const rawSize = box.getSize(new THREE.Vector3());
      const unitScale = getUnitScale(rawSize);
      model.scale.multiplyScalar(unitScale);
      model.updateMatrixWorld(true);

      box = new THREE.Box3().setFromObject(model);
      let size = box.getSize(new THREE.Vector3());
      if (size.x < 0.5 || size.z < 0.3 || size.x > 6 || size.z > 5) {
        const fitScale = Math.min(preset.w / Math.max(size.x, 0.01), preset.d / Math.max(size.z, 0.01));
        model.scale.multiplyScalar(fitScale);
        model.updateMatrixWorld(true);
        box = new THREE.Box3().setFromObject(model);
        size = box.getSize(new THREE.Vector3());
      }
      const center = box.getCenter(new THREE.Vector3());
      model.position.x -= center.x;
      model.position.z -= center.z;
      model.position.y -= box.min.y;

      group.userData.w = size.x;
      group.userData.d = size.z;
      group.userData.area = Math.max(0.2, size.x * size.z);
    }

    function setModelAsSofa(group, model, preset) {
      clearGroup(group);
      normalizeImportedMaterials(model, preset);
      fitModelToSofaGroup(group, model, preset);
      group.add(model);
      group.traverse((child) => {
        if (child.isMesh) child.userData.sofaRoot = group;
      });
      clampSofaToRoom(group);
      hideViewerMessage();
      updateMetrics();
    }

    function showViewerMessage(message) {
      viewerMessage.textContent = message;
      viewerMessage.classList.add('show');
    }

    function hideViewerMessage() {
      viewerMessage.textContent = '';
      viewerMessage.classList.remove('show');
    }

    function loadGltfSofa(group, preset) {
      const placeholder = addRoundedBox(group, [preset.w, 0.45, preset.d], [0, 0.225, 0], makeMat(0xd8c8b8, 0.85), 0.06, 4);
      placeholder.userData.sofaRoot = group;
      showViewerMessage(`${preset.short} 모델을 불러오는 중입니다.`);

      const cached = modelCache.get(preset.modelUrl);
      if (cached) {
        setModelAsSofa(group, cloneModelScene(cached), preset);
        return;
      }

      gltfLoader.load(
        preset.modelUrl,
        (gltf) => {
          modelCache.set(preset.modelUrl, gltf.scene);
          if (group.parent) setModelAsSofa(group, cloneModelScene(gltf.scene), preset);
        },
        undefined,
        (error) => {
          placeholder.material.color.set(0xb94a48);
          const protocolHint = location.protocol === 'file:' ? ' HTML을 더블클릭(file://)으로 열면 GLB 로딩이 막힐 수 있습니다. 로컬 서버로 실행하세요.' : '';
          showViewerMessage(`${preset.modelUrl} 파일을 불러오지 못했습니다.${protocolHint}`);
          console.error('GLB load failed:', preset.modelUrl, error);
        }
      );
    }

    function selectSofa(sofa) {
      selectedSofa = sofa;
      sofaGroup.children.forEach((item) => setSelectedLook(item, item === sofa));
      if (sofa) selectedPresetIndex = sofa.userData.presetIndex;
      renderPresetCards();
      updateMetrics();
    }

    function setSelectedLook(group, active) {
      group.traverse((child) => {
        if (!child.isMesh || child.userData.decorative) return;
        if (!child.userData.baseEmissive) child.userData.baseEmissive = child.material.emissive?.clone?.() || new THREE.Color(0x000000);
        if (child.material.emissive) child.material.emissive.set(active ? 0x1b2a62 : 0x000000);
      });
    }

    function addSofa(presetIndex = selectedPresetIndex) {
      const sofa = makeSofa(presetIndex);
      sofa.position.set(0, 0, Math.min(0.65, roomDepth * 0.18));
      sofa.rotation.y = 0;
      sofaGroup.add(sofa);
      clampSofaToRoom(sofa);
      selectSofa(sofa);
    }

    function changeSelectedPreset(index) {
      selectedPresetIndex = index;
      if (!selectedSofa) {
        addSofa(index);
        return;
      }
      const old = selectedSofa;
      const pos = old.position.clone();
      const rot = old.rotation.y;
      sofaGroup.remove(old);
      disposeObject(old);
      const next = makeSofa(index);
      next.position.copy(pos);
      next.rotation.y = rot;
      sofaGroup.add(next);
      clampSofaToRoom(next);
      selectSofa(next);
    }

    function clampSofaToRoom(sofa) {
      const box = new THREE.Box3().setFromObject(sofa);
      const halfW = (box.max.x - box.min.x) / 2;
      const halfD = (box.max.z - box.min.z) / 2;
      sofa.position.x = THREE.MathUtils.clamp(sofa.position.x, -roomWidth / 2 + halfW + 0.08, roomWidth / 2 - halfW - 0.08);
      sofa.position.z = THREE.MathUtils.clamp(sofa.position.z, -roomDepth / 2 + halfD + 0.08, roomDepth / 2 - halfD - 0.08);
    }

    function centerSelectedSofa() {
      if (!selectedSofa) return;
      selectedSofa.position.set(0, 0, 0.42);
      clampSofaToRoom(selectedSofa);
      updateMetrics();
    }

    function rotateSelectedSofa() {
      if (!selectedSofa) return;
      selectedSofa.rotation.y += Math.PI / 2;
      clampSofaToRoom(selectedSofa);
      updateMetrics();
    }

    function deleteSelectedSofa() {
      if (!selectedSofa) return;
      const sofa = selectedSofa;
      sofaGroup.remove(sofa);
      disposeObject(sofa);
      selectedSofa = sofaGroup.children[0] || null;
      selectSofa(selectedSofa);
    }

    function rebuildRoom() {
      roomWidth = THREE.MathUtils.clamp(Number(roomWidthInput.value) || 5.2, 3, 12);
      roomDepth = THREE.MathUtils.clamp(Number(roomDepthInput.value) || 4.2, 3, 10);
      roomWidthInput.value = roomWidth.toFixed(1);
      roomDepthInput.value = roomDepth.toFixed(1);
      buildRoom();
      sofaGroup.children.forEach(clampSofaToRoom);
      camera.position.set(roomWidth * 0.78, Math.max(3, roomDepth * 0.75), roomDepth * 1.15);
      controls.target.set(0, 0.8, 0);
      controls.update();
      updateMetrics();
    }

    function renderPresetCards() {
      presetGrid.innerHTML = '';
      presets.forEach((preset, index) => {
        const card = document.createElement('div');
        card.className = `preset-card ${index === selectedPresetIndex ? 'active' : ''}`;
        card.innerHTML = `<div class="swatch" style="background:#${preset.color.toString(16).padStart(6, '0')}"></div><div><p class="preset-name">${preset.short}</p><p class="preset-meta">${preset.name}<br>${preset.seats}좌석 · ${preset.w.toFixed(1)} x ${preset.d.toFixed(1)}m</p></div>`;
        card.addEventListener('click', () => changeSelectedPreset(index));
        presetGrid.appendChild(card);
      });
    }

    function updateMetrics() {
      const roomArea = roomWidth * roomDepth;
      const sofaArea = sofaGroup.children.reduce((sum, sofa) => sum + sofa.userData.area, 0);
      const occupancy = Math.min(99, Math.round((sofaArea / roomArea) * 100));
      const freeRatio = 1 - sofaArea / roomArea;
      occupancyEl.textContent = `${occupancy}%`;
      walkwayEl.className = '';
      if (freeRatio > 0.65) {
        walkwayEl.textContent = '충분';
        walkwayEl.classList.add('status-good');
      } else if (freeRatio > 0.45) {
        walkwayEl.textContent = '보통';
        walkwayEl.classList.add('status-warn');
      } else {
        walkwayEl.textContent = '좁음';
        walkwayEl.classList.add('status-bad');
      }

      if (selectedSofa) {
        const box = new THREE.Box3().setFromObject(selectedSofa);
        const distances = [box.min.x + roomWidth / 2, roomWidth / 2 - box.max.x, box.min.z + roomDepth / 2, roomDepth / 2 - box.max.z];
        clearanceEl.textContent = `${Math.max(0, Math.round(Math.min(...distances) * 100))} cm`;
        selectedPresetEl.textContent = presets[selectedSofa.userData.presetIndex].short;
      } else {
        clearanceEl.textContent = '-';
        selectedPresetEl.textContent = '-';
      }
    }

    function setPointer(event) {
      const rect = renderer.domElement.getBoundingClientRect();
      const source = event.touches ? event.touches[0] : event;
      pointer.x = ((source.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((source.clientY - rect.top) / rect.height) * 2 + 1;
    }

    function pickSofa(event) {
      setPointer(event);
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(sofaGroup.children, true);
      return hits.length ? hits[0] : null;
    }

    function onPointerDown(event) {
      const hit = pickSofa(event);
      if (!hit) return;
      event.preventDefault();
      const sofa = hit.object.userData.sofaRoot;
      selectSofa(sofa);
      raycaster.ray.intersectPlane(floorPlane, dragPoint);
      dragOffset.copy(sofa.position).sub(dragPoint);
      isDragging = true;
      controls.enabled = false;
      viewer.classList.add('dragging');
    }

    function onPointerMove(event) {
      if (!isDragging || !selectedSofa) return;
      event.preventDefault();
      setPointer(event);
      raycaster.setFromCamera(pointer, camera);
      if (raycaster.ray.intersectPlane(floorPlane, dragPoint)) {
        selectedSofa.position.copy(dragPoint.add(dragOffset));
        selectedSofa.position.y = 0;
        clampSofaToRoom(selectedSofa);
        updateMetrics();
      }
    }

    function onPointerUp() {
      if (!isDragging) return;
      isDragging = false;
      controls.enabled = true;
      viewer.classList.remove('dragging');
    }

    function addLights() {
      scene.add(new THREE.HemisphereLight(0xffffff, 0xb8a896, 1.15));
      const sun = new THREE.DirectionalLight(0xffffff, 1.95);
      sun.position.set(-3.6, 5.6, 4.2);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      sun.shadow.camera.left = -6;
      sun.shadow.camera.right = 6;
      sun.shadow.camera.top = 6;
      sun.shadow.camera.bottom = -6;
      scene.add(sun);
    }

    function resize() {
      const rect = viewer.getBoundingClientRect();
      camera.aspect = rect.width / rect.height;
      camera.updateProjectionMatrix();
      renderer.setSize(rect.width, rect.height, false);
    }

    function animate() {
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    document.getElementById('rebuildRoom').addEventListener('click', rebuildRoom);
    document.getElementById('rotateSofa').addEventListener('click', rotateSelectedSofa);
    document.getElementById('addSofa').addEventListener('click', () => addSofa(selectedPresetIndex));
    document.getElementById('centerSofa').addEventListener('click', centerSelectedSofa);
    document.getElementById('deleteSofa').addEventListener('click', deleteSelectedSofa);
    renderer.domElement.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove, { passive: false });
    window.addEventListener('mouseup', onPointerUp);
    renderer.domElement.addEventListener('touchstart', onPointerDown, { passive: false });
    window.addEventListener('touchmove', onPointerMove, { passive: false });
    window.addEventListener('touchend', onPointerUp);
    window.addEventListener('resize', resize);

    renderPresetCards();
    addLights();
    buildRoom();
    addSofa(selectedPresetIndex);
    resize();
    animate();
  </script>
</body>
</html>
